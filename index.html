<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Captura de Datos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dive">

        <h1>Captura de datos personales</h1>
        <br>

        <h2>Ingresa los datos que se te piden</h2>
        <br>

        <p>Mi primera encuesta</p>

        <hr>

        <form>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">
            <br><br>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" placeholder="Escribe tu edad">
            <br><br>

            <label for="ciudad">Ciudad donde vives:</label>
            <input type="text" id="ciudad" name="ciudad" placeholder="Escribe tu ciudad">
            <br><br>

            <label for="pasatiempo">Pasatiempo favorito:</label>
            <input type="text" id="pasatiempo" name="pasatiempo" placeholder="Escribe tu pasatiempo">
            <br><br>

            <a href="resultados.html">
                <button type="button">Registrar datos</button>
            </a>

        </form>

    </div>

</body>
</html>
